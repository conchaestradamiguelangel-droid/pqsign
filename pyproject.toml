[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pqsign"
version = "0.1.0"
description = "Post-quantum digital signatures (ML-DSA-87 / NIST FIPS 204) for Python, with key rotation and FastAPI/Flask integration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Miguel Angel Concha Estrada" }]
keywords = ["post-quantum", "cryptography", "ml-dsa", "dilithium", "fips-204", "digital-signature"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "liboqs-python>=0.14.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]
flask = ["flask>=2.3"]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/pqsign/pqsign"

[tool.setuptools.packages.find]
where = ["src"]
